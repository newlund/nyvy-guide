<!doctype html>
{% assign L = site.data.i18n[page.lang] %}
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != 'Nyvo' %}{{ page.title }} · {% endif %}Nyvo</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="top">
    {% if L %}
    <a class="brand" href="{{ '/' | append: page.lang | append: '/' | relative_url }}">
      <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="36" height="36"> Nyvo
    </a>
    <nav>
      <a href="{{ '/' | append: page.lang | append: '/manual.html' | relative_url }}">{{ L.manual }}</a>
      <a href="{{ '/' | append: page.lang | append: '/' | append: L.support_page | append: '.html' | relative_url }}">{{ L.support }}</a>
      <a href="{{ '/' | append: page.lang | append: '/' | append: L.privacy_page | append: '.html' | relative_url }}">{{ L.privacy }}</a>
      <a class="lang" href="{{ '/' | relative_url }}">🌐 {{ L.name }}</a>
    </nav>
    {% else %}
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="36" height="36"> Nyvo
    </a>
    {% endif %}
  </header>
  <main>
    {{ content }}
  </main>
  {% if L %}<footer>{{ L.footer }}</footer>{% endif %}
</body>
</html>
